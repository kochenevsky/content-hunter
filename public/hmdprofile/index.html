<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Help me, Doctor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --pink: #FF8FAB;
  --pink-light: #FFB5C8;
  --pink-pale: #FFF0F4;
  --pink-dim: rgba(255,143,171,0.12);
  --pink-border: rgba(255,143,171,0.25);
  --coral: #FF6B7A;
  --coral-pale: #FFF2F3;
  --yellow: #FFB347;
  --yellow-pale: #FFF8EE;
  --green: #5CC8A0;
  --green-pale: #F0FAF6;
  --bg: #FAFAF8;
  --surface: #FFFFFF;
  --surface2: #F5F4F2;
  --border: rgba(0,0,0,0.07);
  --text: #2D2D2D;
  --text2: #666666;
  --text3: #AAAAAA;
  --font: 'Nunito', sans-serif;
  --nav-h: 68px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --radius: 18px;
  --radius-sm: 12px;
}

html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overflow: hidden; }

/* LOADING */
.loading-screen {
  position: fixed; inset: 0; background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; z-index: 200; transition: opacity 0.35s;
}
.loading-screen.hidden { opacity: 0; pointer-events: none; }
.loading-logo { font-size: 48px; animation: sway 2s ease-in-out infinite; }
@keyframes sway {
  0%,100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}
.loading-title { font-size: 20px; font-weight: 800; color: var(--text); }
.loading-sub { font-size: 13px; color: var(--text3); }
.spinner {
  width: 28px; height: 28px;
  border: 3px solid var(--pink-pale); border-top-color: var(--pink);
  border-radius: 50%; animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* SCREENS */
.screen {
  position: fixed; inset: 0;
  bottom: calc(var(--nav-h) + var(--safe-bottom));
  overflow-y: auto; overflow-x: hidden;
  padding: 0 16px 24px;
  padding-top: max(16px, env(safe-area-inset-top));
  display: none; z-index: 1;
  -webkit-overflow-scrolling: touch;
}
.screen.active { display: block; }
.screen::-webkit-scrollbar { width: 0; }

/* NAV */
nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--border);
  display: flex; z-index: 50;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s;
}
.nav-item:active { transform: scale(0.92); }
.nav-icon { font-size: 22px; line-height: 1; }
.nav-label { font-size: 10px; font-weight: 700; color: var(--text3); transition: color 0.2s; letter-spacing: 0.01em; }
.nav-item.active .nav-label { color: var(--pink); }
.nav-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--pink); opacity: 0; transition: opacity 0.2s;
  position: absolute; bottom: calc(var(--nav-h) - 8px + var(--safe-bottom));
}
.nav-item.active .nav-dot { opacity: 1; }

/* EMPTY / UNREGISTERED */
.empty-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 80vh; gap: 16px; text-align: center; padding: 32px;
}
.empty-icon { font-size: 72px; animation: sway 3s ease-in-out infinite; }
.empty-title { font-size: 22px; font-weight: 900; color: var(--text); line-height: 1.3; }
.empty-sub { font-size: 14px; color: var(--text2); line-height: 1.6; max-width: 260px; }

/* BUTTONS */
.btn-primary {
  background: var(--pink); color: white; border: none;
  border-radius: var(--radius); padding: 15px 28px;
  font-family: var(--font); font-size: 15px; font-weight: 800;
  cursor: pointer; width: 100%; transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary:active { transform: scale(0.97); background: #FF7A9E; }

.btn-outline {
  background: transparent; color: var(--pink);
  border: 2px dashed var(--pink-border);
  border-radius: var(--radius); padding: 14px 20px;
  font-family: var(--font); font-size: 14px; font-weight: 700;
  cursor: pointer; width: 100%; transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.btn-outline:active { background: var(--pink-pale); }
.btn-outline.disabled { color: var(--text3); border-color: var(--border); cursor: default; }

/* PAGE HEADER */
.page-header { padding: 16px 0 12px; }
.page-title { font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: -0.02em; }
.page-sub { font-size: 13px; color: var(--text2); margin-top: 2px; font-weight: 500; }

/* PATIENT CARDS */
.patient-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }

.patient-card {
  background: var(--surface); border-radius: var(--radius);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  overflow: hidden; cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
  animation: slideDown 0.3s forwards;
  opacity: 0;
}
.patient-card:active { transform: scale(0.98); box-shadow: 0 1px 6px rgba(0,0,0,0.04); }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.card-inner { display: flex; }

.card-stripe {
  width: 5px; flex-shrink: 0;
  background: var(--pink-light);
}
.card-stripe.active { background: var(--pink); }
.card-stripe.waiting { background: var(--yellow); }
.card-stripe.closed { background: var(--border); }
.card-stripe.alien {
  background: linear-gradient(180deg, #A78BFA, #C4B5FD);
  animation: alienGlow 3s ease-in-out infinite;
}
@keyframes alienGlow {
  0%,100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.card-body { padding: 14px 14px 14px 12px; flex: 1; }

.card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 6px; }
.card-name { font-size: 16px; font-weight: 800; color: var(--text); }
.card-age { font-size: 13px; color: var(--text2); font-weight: 500; }

.card-tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--pink-pale); color: var(--pink);
  border-radius: 20px; padding: 3px 10px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.01em;
  flex-shrink: 0;
}
.card-tag.alien { background: #F3F0FF; color: #7C3AED; }

.card-complaint {
  font-size: 13px; color: var(--text2); font-style: italic;
  margin-bottom: 10px; line-height: 1.4;
}

.card-meta {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  flex-wrap: wrap;
}
.card-meta-item {
  font-size: 11px; color: var(--text3); font-weight: 600;
  display: flex; align-items: center; gap: 3px;
}
.card-meta-item.has-results { color: var(--green); }

.card-btn {
  width: 100%; background: var(--pink); color: white;
  border: none; border-radius: var(--radius-sm); padding: 10px;
  font-family: var(--font); font-size: 13px; font-weight: 800;
  cursor: pointer; transition: all 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.card-btn:active { background: #FF7A9E; transform: scale(0.98); }
.card-btn.secondary { background: var(--surface2); color: var(--text2); }

/* SECTION LABEL */
.section-label {
  font-size: 11px; font-weight: 800; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--text3);
  margin: 20px 0 10px;
}

/* PATIENT DETAIL (slide panel) */
.panel-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.3);
  z-index: 100; opacity: 0; transition: opacity 0.25s;
  pointer-events: none;
}
.panel-overlay.visible { opacity: 1; pointer-events: all; }

.panel {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg); border-radius: 24px 24px 0 0;
  z-index: 101; padding: 0 16px 40px;
  max-height: 90vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
}
.panel.open { transform: translateY(0); }
.panel::-webkit-scrollbar { width: 0; }

.panel-handle {
  width: 40px; height: 4px; background: var(--border);
  border-radius: 2px; margin: 12px auto 16px;
}

.panel-header { margin-bottom: 16px; }
.panel-name { font-size: 22px; font-weight: 900; color: var(--text); letter-spacing: -0.02em; }
.panel-sub { font-size: 13px; color: var(--text2); margin-top: 2px; font-weight: 500; }

.status-badge {
  display: inline-flex; align-items: center; gap: 5px;
  border-radius: 20px; padding: 4px 12px;
  font-size: 12px; font-weight: 700;
}
.status-badge.active { background: var(--pink-pale); color: var(--pink); }
.status-badge.closed { background: var(--surface2); color: var(--text3); }
.status-badge.alien { background: #F3F0FF; color: #7C3AED; }

/* SECTION IN PANEL */
.panel-section { margin-bottom: 20px; }
.panel-section-title {
  font-size: 10px; font-weight: 800; letter-spacing: 0.15em;
  text-transform: uppercase; color: var(--text3);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.panel-section-title::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

/* CONSULTATION LIST */
.cons-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--surface); border-radius: var(--radius-sm);
  margin-bottom: 6px; border: 1px solid var(--border);
}
.cons-num { font-size: 13px; font-weight: 700; }
.cons-date { font-size: 12px; color: var(--text3); }
.cons-stars { font-size: 13px; }

/* TEST RESULTS */
.test-item {
  background: var(--surface); border-radius: var(--radius-sm);
  border: 1px solid var(--border); margin-bottom: 8px; overflow: hidden;
}
.test-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.test-name { font-size: 13px; font-weight: 700; }
.test-check { font-size: 16px; }
.test-body {
  padding: 0 14px; max-height: 0; overflow: hidden;
  transition: max-height 0.2s, padding 0.2s;
  font-size: 12px; color: var(--text2); line-height: 1.6;
  font-family: 'Courier New', monospace;
  background: var(--surface2);
}
.test-item.open .test-body { max-height: 300px; padding: 10px 14px 14px; }
.test-arrow { font-size: 12px; color: var(--text3); transition: transform 0.2s; }
.test-item.open .test-arrow { transform: rotate(180deg); }

/* FEEDBACK BLOCKS */
.feedback-block {
  border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 8px;
}
.feedback-block.good { background: var(--green-pale); }
.feedback-block.missed { background: var(--yellow-pale); }
.feedback-block.error { background: var(--coral-pale); }
.feedback-icon { font-size: 14px; margin-right: 6px; }
.feedback-text { font-size: 13px; line-height: 1.5; }
.feedback-text strong { font-weight: 700; }

/* STARS */
.stars-row { display: flex; gap: 3px; align-items: center; margin-bottom: 12px; }
.star { font-size: 18px; transition: transform 0.2s; }
.star.filled { animation: starPop 0.2s ease; }
@keyframes starPop { 0% { transform: scale(0); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
.rating-num { font-size: 22px; font-weight: 900; color: var(--text); margin-left: 8px; }

/* PROFILE */
.prof-avatar {
  width: 80px; height: 80px; border-radius: 50%;
  background: linear-gradient(135deg, var(--pink-light), var(--pink));
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 900; color: white;
  margin-bottom: 12px;
}
.prof-name { font-size: 22px; font-weight: 900; color: var(--text); }
.prof-level {
  display: inline-block; background: var(--pink-pale); color: var(--pink);
  border-radius: 20px; padding: 4px 14px;
  font-size: 12px; font-weight: 700; margin-top: 6px; margin-bottom: 4px;
}
.prof-specs { font-size: 13px; color: var(--text2); margin-bottom: 20px; }

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius-sm);
  padding: 16px 14px; border: 1px solid var(--border); text-align: center;
}
.stat-val { font-size: 28px; font-weight: 900; color: var(--text); line-height: 1; margin-bottom: 4px; }
.stat-val.pink { color: var(--pink); }
.stat-val.coral { color: var(--coral); }
.stat-label { font-size: 11px; color: var(--text3); font-weight: 600; }

.strengths-list, .weak-list { list-style: none; padding: 0; }
.strengths-list li, .weak-list li {
  display: flex; align-items: flex-start; gap: 8px;
  font-size: 13px; color: var(--text2); line-height: 1.5;
  padding: 6px 0;
}
.strengths-list li::before { content: '💚'; flex-shrink: 0; }
.weak-list li::before { content: '⚠️'; flex-shrink: 0; }

.rec-chip {
  display: inline-block; background: var(--pink-pale);
  color: var(--pink); border-radius: var(--radius-sm);
  padding: 6px 14px; font-size: 12px; font-weight: 700;
  margin: 4px 4px 0 0;
}

/* STATS SCREEN */
.closed-item {
  background: var(--surface); border-radius: var(--radius-sm);
  border: 1px solid var(--border); padding: 12px 14px;
  margin-bottom: 8px;
}
.closed-name { font-size: 14px; font-weight: 800; }
.closed-diag { font-size: 12px; color: var(--text2); margin: 2px 0 6px; }
.outcome-badge {
  display: inline-block; border-radius: 20px; padding: 3px 10px;
  font-size: 11px; font-weight: 700;
}
.outcome-badge.good { background: var(--green-pale); color: var(--green); }
.outcome-badge.bad { background: var(--coral-pale); color: var(--coral); }
.outcome-badge.neutral { background: var(--surface2); color: var(--text3); }
</style>
</head>
<body>

<div class="loading-screen" id="loading">
  <div class="loading-logo">🏥</div>
  <div class="loading-title">Help me, Doctor</div>
  <div class="loading-sub">Загружаем кабинет...</div>
  <div class="spinner"></div>
</div>

<!-- PANEL OVERLAY -->
<div class="panel-overlay" id="panel-overlay" onclick="closePanel()"></div>

<!-- PATIENT DETAIL PANEL -->
<div class="panel" id="patient-panel">
  <div class="panel-handle"></div>
  <div id="panel-content"></div>
</div>

<!-- SCREEN: PATIENTS -->
<div class="screen active" id="screen-patients">
  <div class="page-header">
    <div class="page-title" id="patients-title">Пациенты</div>
    <div class="page-sub" id="patients-sub"></div>
  </div>
  <div id="patients-list"></div>
</div>

<!-- SCREEN: PROFILE -->
<div class="screen" id="screen-profile">
  <div class="page-header">
    <div class="page-title">Мой профиль</div>
  </div>
  <div id="profile-content"></div>
</div>

<!-- SCREEN: TESTS -->
<div class="screen" id="screen-tests">
  <div class="page-header">
    <div class="page-title">Тесты</div>
    <div class="page-sub">По завершённым пациентам</div>
  </div>
  <div id="tests-content"></div>
</div>

<nav>
  <div class="nav-item active" id="nav-patients" onclick="showScreen('patients')">
    <div class="nav-dot" id="dot-patients"></div>
    <div class="nav-icon">🏥</div>
    <div class="nav-label">Пациенты</div>
  </div>
  <div class="nav-item" id="nav-profile" onclick="showScreen('profile')">
    <div class="nav-dot" id="dot-profile"></div>
    <div class="nav-icon">👤</div>
    <div class="nav-label">Профиль</div>
  </div>
  <div class="nav-item" id="nav-tests" onclick="showScreen('tests')">
    <div class="nav-dot" id="dot-tests"></div>
    <div class="nav-icon">📝</div>
    <div class="nav-label">Тесты</div>
  </div>
</nav>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const WORKER_URL = 'https://helpmedoctor.oxion-ezhkov.workers.dev';  // Оставить пустым — запросы идут на тот же домен
let myUid = null;
let myProfile = null;
let myPatients = [];
let myTests = [];
let currentScreen = 'patients';

// ---- INIT ----
async function init() {
  console.log('Init started', myUid);
  try {
    if (tg?.initDataUnsafe?.user?.id) {
      myUid = String(tg.initDataUnsafe.user.id);
    } else {
      myUid = new URLSearchParams(location.search).get('uid');
    }
    if (!myUid) { showUnregistered(); return; }

    const [profResp, patsResp, testsResp] = await Promise.all([
      fetch(WORKER_URL + '/mini-app/profile?uid=' + myUid),
      fetch(WORKER_URL + '/mini-app/patients?uid=' + myUid),
      fetch(WORKER_URL + '/mini-app/tests?uid=' + myUid),
    ]);
    console.log('Profile response', profResp);

    const prof = await profResp.json();
    if (prof.not_registered) { showUnregistered(); return; }
    myProfile = prof;
    myPatients = await patsResp.json();
    myTests = await testsResp.json();

    renderPatients();
    renderProfile();
    renderTests();
    hide('loading');
  } catch(e) {
    console.error(e);
    hide('loading');
    showUnregistered();
  }
}

function showUnregistered() {
  hide('loading');
  document.getElementById('patients-list').innerHTML = `
    <div class="empty-screen">
      <div class="empty-icon">🏥</div>
      <div class="empty-title">Help me, Doctor 👩‍⚕️</div>
      <div class="empty-sub">Пройдите регистрацию чтобы начать принимать пациентов</div>
      <button class="btn-primary" style="max-width:260px;margin-top:8px" onclick="openBot()">
        Пройти регистрацию
      </button>
    </div>
  `;
}

function openBot() {
  if (tg) tg.close();
}

// ---- SCREENS ----
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('screen-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  currentScreen = name;
}

function hide(id) { document.getElementById(id)?.classList.add('hidden'); }

// ---- PATIENTS ----
function renderPatients() {
  const active = myPatients.filter(p => p.status !== 'closed');
  // Закрытые — новейшие вверху
  const closed = myPatients
    .filter(p => p.status === 'closed')
    .sort((a, b) => (b.closed_at || 0) - (a.closed_at || 0));

  document.getElementById('patients-title').textContent = 'Пациенты';
  document.getElementById('patients-sub').textContent =
    active.length ? active.length + ' активн' + (active.length === 1 ? 'ый' : 'ых') : 'Нет активных';

  let html = '';

  if (active.length === 0) {
    html += `<div style="text-align:center;padding:32px 20px;color:var(--text3)">
      <div style="font-size:48px;margin-bottom:12px">🩺</div>
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">Очередь пуста</div>
      <div style="font-size:13px">Примите нового пациента чтобы начать</div>
    </div>`;
  }

  active.forEach((p, i) => { html += patientCard(p, i, false); });

  const canAdd = active.length < 6;
  html += `<div style="margin-top:8px;margin-bottom:24px">
    <button class="btn-outline ${canAdd ? '' : 'disabled'}"
      onclick="${canAdd ? 'newPatient()' : ''}">
      ${canAdd ? '+ Принять нового пациента' : '🔒 Максимум 6 пациентов'}
    </button>
  </div>`;

  if (closed.length) {
    html += '<div class="section-label">Завершённые</div>';
    closed.forEach((p, i) => { html += patientCard(p, active.length + i, true); });
  }

  document.getElementById('patients-list').innerHTML = html;
  document.querySelectorAll('.patient-card').forEach((el, i) => {
    el.style.animationDelay = (i * 0.06) + 's';
  });
}

function patientCard(p, idx, isClosed) {
  const isAlien = p.is_alien;
  const hasResults = (p.test_results || []).length > 0;
  const stripeClass = isAlien ? 'alien' : isClosed ? 'closed' : 'active';
  const tagClass = isAlien ? 'alien' : '';
  const tagText = isAlien ? '👽 Особый' : (p.specialization || '');
  const lastCons = p.consultations?.length ? 'Консультаций: ' + p.consultations.length : 'Первичный приём';

  const actionBtn = isClosed
    ? `<div style="display:flex;gap:8px">
        <button class="card-btn secondary" style="flex:1" onclick="openPatient('${esc(p.id)}')">📋 История</button>
        <button class="card-btn" style="flex:1" onclick="repeatConsultation(event,'${esc(p.id)}')">🔄 Повторно</button>
       </div>`
    : `<button class="card-btn" onclick="startConsultation(event, '${esc(p.id)}')">▶️ Начать приём</button>`;

  return `<div class="patient-card" onclick="openPatient('${esc(p.id)}')">
    <div class="card-inner">
      <div class="card-stripe ${stripeClass}"></div>
      <div class="card-body">
        <div class="card-top">
          <div>
            <div class="card-name">${esc(p.name)}</div>

function toggleTest(i) {

function renderStars(rating) {
  const full = Math.floor(rating);
  const half = rating - full >= 0.5 ? 1 : 0;
  const empty = 5 - full - half;
  let html = '<div class="stars-row">';
  for (let i = 0; i < full; i++) html += '<span class="star filled">⭐</span>';
  if (half) html += '<span class="star filled">✨</span>';
  for (let i = 0; i < empty; i++) html += '<span class="star">☆</span>';
  html += `<span class="rating-num">${rating.toFixed(1)}</span></div>`;
  return html;
}

function renderStarsSmall(rating) {
  const full = Math.round(rating);
  return '⭐'.repeat(Math.min(full, 5));
}

function renderXpBar(p) {
  const MAX_LEVEL = 200;
  function getXpForLevel(l) { return Math.round(100 * l + 5 * l * (l - 1)); }
  function getTotalXpForLevel(l) { let t=0; for(let i=1;i<l;i++) t+=getXpForLevel(i); return t; }

  const xp = p.xp || 0;
  let level = 1;
  while (level < MAX_LEVEL && xp >= getTotalXpForLevel(level + 1)) level++;

  const currentLevelXp = getTotalXpForLevel(level);
  const nextLevelXp = level < MAX_LEVEL ? getTotalXpForLevel(level + 1) : null;
  const progress = nextLevelXp
    ? Math.round(((xp - currentLevelXp) / (nextLevelXp - currentLevelXp)) * 100)
    : 100;
  const xpLeft = nextLevelXp ? nextLevelXp - xp : 0;

  return `<div style="margin-top:10px">
    <div style="display:flex;justify-content:space-between;font-size:12px;opacity:0.85;margin-bottom:5px">
      <span style="font-weight:800">Уровень ${level}</span>
      <span>${xp} XP${nextLevelXp?' · ещё '+xpLeft+' XP':' · макс'}</span>
    </div>
    <div style="height:8px;background:rgba(255,255,255,0.3);border-radius:4px;overflow:hidden">
      <div style="height:100%;width:${progress}%;background:white;border-radius:4px;transition:width 0.5s"></div>
    </div>
  </div>`;
}

function renderDailyTask(p) {
  const task = p.daily_task;
  const today = new Date().toISOString().slice(0, 10);
  if (!task || task.date !== today) {
    return `<div style="width:100%;margin:12px 0">
      <div class="section-label" style="margin:0 0 8px">Задание дня</div>
      <div style="padding:12px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;color:var(--text3);text-align:center">
        Появится после первой консультации
      </div>
    </div>`;
  }
  const pct = task.target > 1 ? Math.round(((task.progress||0)/task.target)*100) : (task.done?100:0);
  const progressBar = !task.done
    ? `<div style="height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:10px">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--pink-light),var(--pink));border-radius:3px"></div>
      </div>`
    : '';
  return `<div style="width:100%;margin:12px 0">
    <div class="section-label" style="margin:0 0 8px">Задание дня</div>
    <div style="padding:14px;background:${task.done?'var(--green-pale)':'var(--surface)'};
      border-radius:var(--radius-sm);border:1px solid ${task.done?'var(--green)':'var(--border)'}">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="font-size:20px">${task.done?'✅':'🎯'}</span>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:800;color:${task.done?'var(--green)':'var(--text)'}">${esc(task.desc)}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">+${task.xp} XP · ${task.progress||0}/${task.target}</div>
        </div>
      </div>
      ${progressBar}
    </div>
  </div>`;
}

function declDays(n) {
  const abs = Math.abs(n) % 100;
  const mod = abs % 10;
  if (abs >= 11 && abs <= 19) return 'дней';
  if (mod === 1) return 'день';
  if (mod >= 2 && mod <= 4) return 'дня';
  return 'дней';
}

function renderTests() {

  if (!myTests.length) {
    document.getElementById('tests-content').innerHTML = `
      <div style="text-align:center;padding:40px 20px;color:var(--text3)">
        <div style="font-size:48px;margin-bottom:12px">📝</div>

        <div style="font-size:13px">После завершения приёма появится тест по ошибкам</div>
      </div>`;
    return;
  }

  let html = '';

  if (pending.length) {
    html += '<div class="section-label">Пройти</div>';
    html += pending.map(t => `
      <div style="background:var(--surface);border-radius:var(--radius);box-shadow:0 2px 12px rgba(0,0,0,0.06);overflow:hidden;margin-bottom:12px">
        <div style="width:100%;height:4px;background:var(--pink)"></div>

          <button class="btn-primary" onclick="startTest('${esc(t.pat_id)}')">
            ${t.status === 'in_progress' ? '▶️ Продолжить тест' : '📝 Начать тест'}
          </button>
        </div>
      </div>
    `).join('');
  }

  if (done.length) {
    html += '<div class="section-label" style="margin-top:16px">Пройденные</div>';
    html += done.map(t => {
      const icons = t.answers?.map(a => a.is_correct ? '✅' : '❌').join('') || '';
      const score = t.score ?? 0;
      const color = score >= 4 ? 'var(--green)' : score >= 3 ? 'var(--yellow)' : 'var(--coral)';
      return `
        <div style="background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden">
          <div style="width:100%;height:4px;background:var(--border)"></div>
          <div style="padding:14px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:15px;font-weight:800">${esc(t.pat_name)}</div>
                <div style="font-size:12px;color:var(--text3);margin-top:2px">${esc(t.specialization || '')}</div>
              </div>
              <div style="font-size:22px;font-weight:900;color:${color}">${score}/5</div>
            </div>
            <div style="font-size:16px;margin-top:8px;letter-spacing:2px">${icons}</div>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('tests-content').innerHTML = html;
}

function startTest(patId) {
  fetch(WORKER_URL + '/mini-app/action?uid=' + myUid + '&action=start_test&pat_id=' + patId);
  if (tg) tg.close();
}

// ---- HELPERS ----
function formatDate(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  const now = new Date();
  const diff = Math.floor((now - d) / 86400000);
  if (diff === 0) return 'Сегодня';
  if (diff === 1) return 'Вчера';
  return d.toLocaleDateString('ru', { day: 'numeric', month: 'short' });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

init();
</script>
