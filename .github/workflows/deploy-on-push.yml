name: Deploy to Both Servers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - name: primary
            host: "5.42.104.246"
            user: "root"
            pass: SERVER1_SSH_PASSWORD
            path: "/var/www/content-hunter/"
          - name: backup
            host: "83.222.27.72"
            user: "root"
            pass: SERVER2_SSH_PASSWORD
            path: "/var/www/content-hunter/"
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps and build
        env:
          NEXT_PUBLIC_SERVER_URL: "https://contenthunter.ru"
          NEXT_PUBLIC_SUPABASE_URL: "https://feytgokjblyqzymadfym.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZleXRnb2tqYmx5cXp5bWFkZnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDg3MzksImV4cCI6MjA4NTI4NDczOX0.IjRLp_2URxV43OmkGdHUY2v-Jmb4XynxCgXjRIMqQ-8"
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          AMOCRM_SUBDOMAIN: ${{ secrets.AMOCRM_SUBDOMAIN }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Deploy to ${{ matrix.server.name }} server
        env:
          SSH_PASS: ${{ secrets[matrix.server.pass] }}
          SSH_HOST: ${{ matrix.server.host }}
          SSH_USER: ${{ matrix.server.user }}
          REMOTE_PATH: ${{ matrix.server.path }}
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          AMOCRM_SUBDOMAIN: ${{ secrets.AMOCRM_SUBDOMAIN }}
        continue-on-error: true
        run: |
          if [ -z "$SSH_PASS" ]; then
            echo "⚠️ SSH password for ${{ matrix.server.name }} not set. Skipping."
            exit 0
          fi
          
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          export SSHPASS="$SSH_PASS"
          
          echo "📦 Uploading build to ${{ matrix.server.name }} server ($SSH_HOST)..."
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            .next/ $SSH_USER@$SSH_HOST:${REMOTE_PATH}.next/
          
          echo "🔄 Pulling latest code on ${{ matrix.server.name }}..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            cd ${REMOTE_PATH} &&
            git pull origin main
          " || echo "⚠️ Git pull failed, continuing anyway..."
          
          echo "🧹 Clearing Next.js cache and restarting PM2 on ${{ matrix.server.name }}..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            cd ${REMOTE_PATH} &&
            rm -rf .next/cache &&
            pm2 restart content-hunter &&
            pm2 save
          "
          
          echo "🔧 Setting up environment variables for PM2 on ${{ matrix.server.name }}..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            cd ${REMOTE_PATH} &&
            pm2 env 0 set AMO_TOKEN='$AMO_TOKEN' 2>/dev/null || true &&
            pm2 env 0 set AMOCRM_SUBDOMAIN='$AMOCRM_SUBDOMAIN' 2>/dev/null || true
          " || echo "⚠️ PM2 env set failed, trying alternative method..."
          
          echo "✅ ${{ matrix.server.name }} deploy completed!"
