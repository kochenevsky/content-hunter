name: Deploy to Backup Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps and build
        env:
          NEXT_PUBLIC_SERVER_URL: "https://contenthunter.ru"
          NEXT_PUBLIC_SUPABASE_URL: "https://feytgokjblyqzymadfym.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZleXRnb2tqYmx5cXp5bWFkZnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDg3MzksImV4cCI6MjA4NTI4NDczOX0.IjRLp_2URxV43OmkGdHUY2v-Jmb4XynxCgXjRIMqQ-8"
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Deploy to Backup Server
        env:
          SSH_PASS: ${{ secrets.SERVER2_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          REMOTE_PATH: ${{ secrets.SERVER2_PATH }}
        run: |
          if [ -z "$SSH_PASS" ]; then
            echo "❌ SSH password not set"
            exit 1
          fi
          
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          export SSHPASS="$SSH_PASS"
          
          echo "📦 Uploading build to server..."
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            .next/ $SSH_USER@$SSH_HOST:${REMOTE_PATH}.next/
          
          echo "🔄 Pulling latest code..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            cd ${REMOTE_PATH} &&
            git pull origin main
          "
          
          echo "🔄 Restarting PM2..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            pm2 restart content-hunter &&
            pm2 save
          "
          
          echo "✅ Deploy completed!"
