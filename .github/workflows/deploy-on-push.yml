# Запускает деплой на Vercel при push в main через Deploy Hook.
# Работает даже если в Vercel сломана привязка Git.
# Нужно: в Vercel создать Deploy Hook, в GitHub добавить секрет VERCEL_DEPLOY_HOOK с его URL.

name: Deploy to Vercel on push

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            echo "VERCEL_DEPLOY_HOOK not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 0
          fi
          curl -f -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
        env: {}
