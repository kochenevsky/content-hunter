name: Deploy to Backup Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to Backup Server
        env:
          SSH_PASS: ${{ secrets.SERVER2_SSH_PASSWORD }}
          SSH_HOST: ${{ secrets.SERVER2_HOST }}
          SSH_USER: ${{ secrets.SERVER2_USER }}
          REMOTE_PATH: ${{ secrets.SERVER2_PATH }}
        run: |
          if [ -z "$SSH_PASS" ]; then
            echo "❌ SSH password not set. Add SERVER2_SSH_PASSWORD in repository secrets."
            exit 1
          fi
          
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          export SSHPASS="$SSH_PASS"
          
          echo "🔄 Updating code and rebuilding on server..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            $SSH_USER@$SSH_HOST "
            cd ${REMOTE_PATH} &&
            git pull origin main &&
            pnpm install --no-frozen-lockfile &&
            pnpm build &&
            pm2 restart content-hunter &&
            pm2 save
          "
          
          echo "✅ Deploy completed successfully!"
