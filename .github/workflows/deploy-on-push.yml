name: Deploy on push

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
     matrix:
  server:
    - name: primary
      host: SERVER1_HOST
      user: SERVER1_USER
      pass: TIMEWEB_SSH_PASSWORD    # ← Вот здесь
      path: SERVER1_PATH
    - name: backup
      host: SERVER2_HOST
      user: SERVER2_USER
      pass: SERVER2_SSH_PASSWORD
      path: SERVER2_PATH
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps and build
        env:
          NEXT_PUBLIC_SERVER_URL: https://contenthunter.ru
          NEXT_PUBLIC_SUPABASE_URL: https://feytgokjblyqzymadfym.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZleXRnb2tqYmx5cXp5bWFkZnltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDg3MzksImV4cCI6MjA4NTI4NDczOX0.IjRLp_2URxV43OmkGdHUY2v-Jmb4XynxCgXjRIMqQ-8
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Deploy to ${{ matrix.server.name }} server
        env:
          SSH_PASS: ${{ secrets[matrix.server.pass] }}
        run: |
          if [ -z "$SSH_PASS" ]; then
            echo "⚠️ SSH password for ${{ matrix.server.name }} not set. Skipping."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          export SSHPASS="$SSH_PASS"
          
          echo "🔧 Preparing remote directory on ${{ matrix.server.name }}..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets[matrix.server.user] }}@${{ secrets[matrix.server.host] }} "
            # Создаём папку .next если её нет
            mkdir -p ${{ secrets[matrix.server.path] }}.next
            # Удаляем старую сборку ПОЛНОСТЬЮ
            rm -rf ${{ secrets[matrix.server.path] }}.next/*
            # Устанавливаем правильные права (на всякий случай)
            chown -R $(whoami):$(whoami) ${{ secrets[matrix.server.path] }}.next
            chmod -R 755 ${{ secrets[matrix.server.path] }}.next
          "
          
          echo "📦 Uploading new build to ${{ matrix.server.name }}..."
          # Копируем с удалением лишних файлов на сервере (--delete)
          sshpass -e rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30" \
            .next/ ${{ secrets[matrix.server.user] }}@${{ secrets[matrix.server.host] }}:${{ secrets[matrix.server.path] }}.next/
          
          echo "🔄 Updating code and restarting PM2 on ${{ matrix.server.name }}..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
            ${{ secrets[matrix.server.user] }}@${{ secrets[matrix.server.host] }} "
            cd ${{ secrets[matrix.server.path] }} &&
            git pull origin main &&
            pnpm install --no-frozen-lockfile &&
            pm2 restart content-hunter &&
            pm2 save
          "
          
          echo "✅ ${{ matrix.server.name }} deploy OK"
